<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>1C Chat Debug</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        #log { background: #f0f0f0; padding: 10px; height: 300px; overflow: auto; font-family: monospace; white-space: pre-wrap; }
        button { margin: 5px; padding: 5px 10px; }
        #rooms { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
        .room { cursor: pointer; padding: 3px; }
        .room:hover { background: #ddd; }
    </style>
</head>
<body>
<h2>1C Chat Debug</h2>
<div>
    <button onclick="login('Администратор','3d933d37-ebc8-11e3-80d5-001cc046e2ac','Администратор','admin')">Войти как Админ</button>
    <button onclick="login('БутенкоТатьяна','3d933d37-ebc8-11e3-80d5-001cc046e2ac','Бутенко Татьяна','user')">Войти как Пользователь</button>
    <span id="userLabel"></span>
</div>
<hr>
<div id="log">Лог действий:<br></div>
<div id="rooms">Комнаты: не загружены</div>

<script>
function log(msg) {
    var logDiv = document.getElementById('log');
    logDiv.innerHTML += new Date().toLocaleTimeString() + ' ' + msg + '<br>';
    logDiv.scrollTop = logDiv.scrollHeight;
    alert(msg); // временно для наглядности в 1С
}

function ajax(method, url, data, callback) {
    log('AJAX ' + method + ' ' + url);
    var xhr = new XMLHttpRequest();
    xhr.open(method, url, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
            log('Ответ ' + url + ': статус ' + xhr.status);
            if (xhr.status === 200) {
                try {
                    var resp = JSON.parse(xhr.responseText);
                    log('Данные: ' + JSON.stringify(resp).substring(0, 200));
                    callback(null, resp);
                } catch(e) {
                    log('Ошибка парсинга JSON: ' + e.message);
                    callback(e, null);
                }
            } else {
                callback(new Error('HTTP ' + xhr.status), null);
            }
        }
    };
    xhr.send(data ? JSON.stringify(data) : null);
}

var currentUserId = null;
var currentOrgId = '3d933d37-ebc8-11e3-80d5-001cc046e2ac';

function login(uid, oid, name, role) {
    log('Вход: ' + uid + ' (' + name + ')');
    currentUserId = uid;
    document.getElementById('userLabel').innerHTML = 'Вы вошли как ' + name;
    ajax('POST', '/api/auth', {
        id_user: uid,
        id_org: oid,
        username: name,
        role: role
    }, function(err, res) {
        if (err) {
            log('Ошибка авторизации: ' + err.message);
            return;
        }
        log('Авторизация успешна: ' + JSON.stringify(res));
        // Теперь загружаем комнаты
        loadRooms();
        loadUsers();
    });
}

function loadRooms() {
    if (!currentUserId) {
        log('loadRooms: нет пользователя');
        return;
    }
    log('Запрос комнат для ' + currentUserId);
    ajax('GET', '/api/rooms?id_org=' + currentOrgId + '&id_user=' + currentUserId, null, function(err, res) {
        if (err) {
            log('Ошибка загрузки комнат: ' + err.message);
            return;
        }
        log('Получено комнат: ' + (res.rooms ? res.rooms.length : 0));
        if (res && res.rooms) {
            var html = '<h3>Комнаты:</h3>';
            for (var i = 0; i < res.rooms.length; i++) {
                var r = res.rooms[i];
                html += '<div class="room" onclick="selectRoom(' + r.id_room + ')">' + (r.type == 'private' ? '💬' : '👥') + ' ' + r.name + '</div>';
            }
            document.getElementById('rooms').innerHTML = html;
        } else {
            document.getElementById('rooms').innerHTML = 'Нет комнат или ошибка';
        }
    });
}

function loadUsers() {
    ajax('GET', '/api/users?id_org=' + currentOrgId, null, function(err, res) {
        if (!err && res && res.users) {
            log('Пользователей: ' + res.users.length);
        }
    });
}

function selectRoom(roomId) {
    log('Выбрана комната ' + roomId);
    alert('Выбрана комната ' + roomId);
}
</script>
</body>
</html>
