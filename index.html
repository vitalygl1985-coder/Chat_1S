<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корпоративный чат 1С</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-main: #f3f4f6;
            --bg-panel: #ffffff;
            --border-color: #e5e7eb;
            --text-main: #1f2937;
            --text-muted: #9ca3af;
            --online-color: #10b981;
            --offline-color: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { height: 100vh; max-height: 100vh; background: var(--bg-main); color: var(--text-main); overflow: hidden; }

        .app-container {
            display: grid;
            grid-template-columns: 260px 1fr 280px;
            height: 100vh;
            max-height: 100vh;
            background: var(--bg-panel);
            overflow: hidden;
        }

        .panel {
            display: flex;
            flex-direction: column;
            background: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
        }
        .panel-header {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }
        .search-box {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            font-size: 13px;
        }
        .search-box:focus { border-color: var(--primary-color); }
        .panel-scroll-area { flex: 1; overflow-y: auto; padding: 8px; }

        .room-item {
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
        }
        .room-item:hover { background: var(--bg-main); }
        .room-item.active { background: #eff6ff; color: var(--primary-color); font-weight: 600; }
        
        .accordion-section { margin-top: 15px; border-top: 1px dashed var(--border-color); padding-top: 10px; }
        .accordion-header {
            font-weight: bold; color: var(--text-muted); cursor: pointer; padding: 5px; font-size: 11px;
            text-transform: uppercase; display: flex; justify-content: space-between;
        }
        .accordion-content { display: none; margin-top: 5px; }
        .accordion-content.open { display: block; }

        .chat-panel { border-right: 1px solid var(--border-color); background: #fafafa; }
        .chat-header {
            height: 55px;
            padding: 0 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-panel);
            flex-shrink: 0;
        }
        .chat-title { font-weight: 600; font-size: 15px; }
        .chat-actions { display: flex; gap: 6px; }
        
        .btn {
            padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px; color: white;
        }
        .btn-primary { background: var(--primary-color); }
        .btn-warn { background: #eab308; }
        .btn-danger { background: #ef4444; }

        .messages-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 75%; display: flex; flex-direction: column; margin-bottom: 2px; align-self: flex-start; }
        .message.my { align-self: flex-end; }
        .message-box { padding: 8px 12px; border-radius: 12px; background: var(--bg-panel); box-shadow: 0 1px 2px rgba(0,0,0,0.05); position: relative; }
        .message.my .message-box { background: #dbeafe; }
        .msg-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-bottom: 2px; gap: 15px;}
        .msg-author { font-weight: 600; }
        .msg-text { font-size: 13px; line-height: 1.4; word-break: break-word; }
        
        .msg-delete-trigger { position: absolute; right: 5px; top: 5px; display: none; cursor: pointer; font-size: 11px; }
        .message-box:hover .msg-delete-trigger { display: block; }

        .input-area { 
            background: var(--bg-panel); 
            border-top: 1px solid var(--border-color); 
            padding: 10px 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            position: relative;
            flex-shrink: 0;
        }
        
        .toolbar { display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--bg-main); padding-bottom: 6px; }
        .toolbar-item { cursor: pointer; font-size: 13px; color: var(--text-main); user-select: none; padding: 2px 4px; border-radius: 3px; }
        .toolbar-item:hover { background: var(--bg-main); }
        .toolbar select { font-size: 11px; padding: 2px; border: 1px solid var(--border-color); border-radius: 3px; outline: none; }
        
        .controls-row { display: flex; gap: 8px; align-items: center; }
        .input-msg-div {
            flex: 1; height: 36px; max-height: 70px; overflow-y: auto;
            border: 1px solid var(--border-color); border-radius: 6px;
            padding: 8px; outline: none; background: #fff; font-size: 13px;
        }

        .mention-popup {
            position: absolute; bottom: 100%; left: 15px; width: 220px;
            background: #fff; border: 1px solid var(--border-color); border-radius: 6px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1); display: none; max-height: 120px; overflow-y: auto; z-index: 1000;
        }
        .mention-item { padding: 6px 10px; cursor: pointer; font-size: 12px; }
        .mention-item:hover { background: var(--bg-main); }

        /* ПРАВАЯ ПАНЕЛЬ */
        .right-panel { border-right: none; }
        .section-title { font-size: 11px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; margin: 10px 0 5px 5px; letter-spacing: 0.5px; }
        .user-row { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .user-row:hover { background: var(--bg-main); }
        
        .avatar-container { position: relative; width: 28px; height: 28px; }
        .avatar { width: 28px; height: 28px; background: #e5e7eb; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; color: #4b5563; }
        .status-badge { position: absolute; bottom: 0; right: 0; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid #fff; }
        .status-badge.online { background: var(--online-color); }
        .status-badge.offline { background: var(--offline-color); }
        .user-info-meta { flex: 1; display: flex; flex-direction: column; }
        .user-role { font-size: 10px; color: var(--text-muted); }

        .view-pane { display: none; }
        .view-pane.active { display: block; }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="panel left-panel">
        <div class="panel-header">
            <h3 style="font-size: 14px;">Кабинеты</h3>
            <input type="text" class="search-box" id="search-rooms" placeholder="Поиск кабинета...">
            <button class="btn btn-primary" id="btn-create-group" style="width:100%;">+ Создать Кабинет</button>
        </div>
        <div class="panel-scroll-area">
            <div id="active-rooms-list"></div>
            
            <div class="accordion-section">
                <div class="accordion-header" id="inactive-accordion-trigger">
                    <span>Неактивные сообщения</span>
                    <span id="inactive-count">(0) ▼</span>
                </div>
                <div class="accordion-content" id="inactive-rooms-list"></div>
            </div>
        </div>
    </div>

    <div class="panel chat-panel">
        <div class="chat-header">
            <div class="chat-title" id="current-chat-title">Выберите чат для начала общения</div>
            <div class="chat-actions" id="chat-management-controls" style="display: none;">
                <button class="btn btn-warn" id="btn-archive-room">📦 В архив</button>
                <button class="btn btn-danger" id="btn-delete-room">❌ Удалить чат</button>
            </div>
        </div>
        
        <div class="messages-container" id="messages-stream"></div>
        
        <div class="input-area">
            <div class="mention-popup" id="mention-menu"></div>

            <div class="toolbar">
                <select id="font-family-select">
                    <option value="Segoe UI">Стандартный</option>
                    <option value="Courier New">Широкий (Код)</option>
                    <option value="Georgia">Строгий</option>
                    <option value="Impact">Жирный акцент</option>
                </select>
                <select id="font-size-select">
                    <option value="13px">13px</option>
                    <option value="12px">12px</option>
                    <option value="15px">15px</option>
                </select>
                <div class="toolbar-item" id="style-bold" style="font-weight:bold;">B</div>
                <div class="toolbar-item" id="style-italic" style="font-style:italic;">I</div>
                
                <div class="toolbar-item" id="btn-emoji-trigger" title="Открыть панель эмодзи">😀</div>
                
                <input type="color" id="text-color-picker" title="Цвет текста" style="width:16px; height:16px; border:none; cursor:pointer;" value="#1f2937">
                <input type="color" id="text-bg-picker" title="Маркер выделения" style="width:16px; height:16px; border:none; cursor:pointer;" value="#ffffff">
                
                <div style="border-left: 1px solid var(--border-color); height: 16px; margin: 0 4px;"></div>
                <div class="toolbar-item" id="btn-secret-toggle" title="Шифрование сообщения" style="font-size: 12px;">🔓 Открыто</div>
            </div>

            <div class="controls-row">
                <input type="file" id="global-file-input" style="display:none">
                <button class="btn btn-primary" id="btn-attach-file" style="background:#6b7280; padding: 10px 14px;" title="Отправить файл">📎</button>
                <button class="btn btn-primary" id="btn-screenshot-editor" style="background:#4b5563; padding: 10px 15px;" title="Редактор скриншотов">📋 Скриншот</button>
                
                <div class="input-msg-div" id="input-msg" contenteditable="true" placeholder="Напишите сообщение..."></div>
                
                <button class="btn btn-primary" id="btn-send-message" style="padding: 10px 20px;">Отправить</button>
            </div>
        </div>
    </div>

    <div class="panel right-panel">
        <div class="panel-header">
            <button class="btn btn-primary" id="btn-toggle-right-view" style="width:100%; background: #4b5563;">👥 Все сотрудники</button>
        </div>
        <div class="panel-scroll-area">
            
            <div id="pane-participants" class="view-pane active">
                <div class="section-title">В этом кабинете <button id="btn-add-user-modal" style="border:none; background:none; color:var(--primary-color); cursor:pointer; font-weight:bold; font-size:13px; float:right;">+</button></div>
                <div id="current-room-participants"></div>
            </div>
            
            <div id="pane-company" class="view-pane">
                <input type="text" class="search-box" id="search-contacts" placeholder="Быстрый поиск коллеги..." style="margin-bottom: 10px;">
                <div class="section-title">Все сотрудники компании</div>
                <div id="company-users-list"></div>
            </div>
            
        </div>
    </div>

</div>

<script>
    window.onerror = function() { return true; };

    let socket = null;
    let currentRoomId = null;
    let currentUser = null; 
    let sessionToken = null;
    let globalUsersCache = []; 
    let roomParticipantsCache = []; 
    let isMentionMenuOpen = false;
    let isSecretMode = false;
    let userSecretKey = "";

    let currentTextStyles = { fontFamily: 'Segoe UI', fontSize: '13px', isBold: false, isItalic: false, color: '#1f2937', background: '#ffffff' };

    const inputMsg = document.getElementById('input-msg');
    const messagesStream = document.getElementById('messages-stream');

    document.getElementById('inactive-accordion-trigger').addEventListener('click', function() {
        var content = document.getElementById('inactive-rooms-list');
        content.classList.toggle('open');
        this.querySelector('span:last-child').innerText = content.classList.contains('open') ? '▲' : '▼';
    });

    document.getElementById('btn-toggle-right-view').addEventListener('click', function() {
        const panePart = document.getElementById('pane-participants');
        const paneComp = document.getElementById('pane-company');
        if (panePart.classList.contains('active')) {
            panePart.classList.remove('active'); paneComp.classList.add('active');
            this.innerText = "🚪 Вернуться к кабинету"; this.style.background = "#6b7280";
        } else {
            paneComp.classList.remove('active'); panePart.classList.add('active');
            this.innerText = "👥 Все сотрудники"; this.style.background = "#4b5563";
        }
    });

    async function initApplication() {
        const urlParams = new URLSearchParams(window.location.search);
        const ticket = urlParams.get('ticket');
        if (!ticket) { alert("Ошибка безопасности: Отсутствует токен авторизации 1С."); return; }

        try {
            const response = await fetch('/api/web/exchange-ticket', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticket: ticket })
            });

            const data = await response.json();
            if (data.success) {
                sessionToken = data.token;
                currentUser = data.user;
                connectSockets();
                initUIEventListeners();
                initMentionLogic();
            } else { alert("Ошибка авторизации: Токен устарел."); }
        } catch (err) { alert("Не удалось связаться с сервером авторизации."); }
    }

    function connectSockets() {
        const socketUrl = window.location.protocol + '//' + window.location.host;
        socket = io(socketUrl, {
            path: '/socket.io',
            transports: ['polling', 'websocket'],
            query: { id_user: currentUser.id_user, id_org: currentUser.id_org, username: currentUser.username, role: currentUser.role }
        });

        socket.on('connect', () => { refreshRoomsAndLists(); socket.emit('get_users_list'); });
        socket.on('rooms_list', (rooms) => { processRoomsDivision(rooms); });
        socket.on('users_list', (users) => { globalUsersCache = users; renderCompanyUsers(users); });
        
        socket.on('new_message', (msg) => { 
            if (msg && msg.id_room == currentRoomId) displayMessage(msg, false); 
        });

        socket.on('room_participants_list', (data) => {
            roomParticipantsCache = data.participants || [];
            renderCurrentRoomParticipants(roomParticipantsCache);
        });

        socket.on('message_deleted', (data) => {
            const el = document.querySelector(`[data-msg-id="${data.id_message}"] .msg-text`);
            if (el) el.innerHTML = '<span style="color:#9ca3af; font-style:italic;">Сообщение удалено автором</span>';
        });

        socket.on('private_chat_created', (data) => { if (data && data.id_room) selectRoomById(data.id_room); });
        socket.on('system_alert', (data) => { alert(data.message); });
        socket.on('download_archive_file', (data) => { if (data && data.url) window.open(data.url, '_blank'); });
        
        // Перехват глобального триггера обновления комнат
        socket.on('refresh_rooms_trigger', () => { refreshRoomsAndLists(); });
    }

    async function refreshRoomsAndLists() {
        if (socket) socket.emit('get_rooms_again');
    }

    function processRoomsDivision(allRooms) {
        const activeContainer = document.getElementById('active-rooms-list');
        const inactiveContainer = document.getElementById('inactive-rooms-list');
        activeContainer.innerHTML = ""; inactiveContainer.innerHTML = "";
        let inactiveCount = 0;

        allRooms.forEach(room => {
            const div = document.createElement('div');
            div.className = `room-item ${room.id_room == currentRoomId ? 'active' : ''}`;
            let icon = room.type === 'private' ? '💬 ' : (room.type === 'admin_group' ? '👑 ' : '👥 ');
            div.innerText = icon + room.name;
            div.addEventListener('click', () => selectRoomById(room.id_room, room.name, room.type, room.created_by));
            
            if (room.participants_count < 2) { inactiveContainer.appendChild(div); inactiveCount++; }
            else { activeContainer.appendChild(div); }
        });
        document.getElementById('inactive-count').innerText = `(${inactiveCount}) ▼`;
    }

    function selectRoomById(roomId, name, type, createdBy) {
        currentRoomId = roomId;
        document.getElementById('current-chat-title').innerText = name || "Кабинет";
        const managementRow = document.getElementById('chat-management-controls');
        managementRow.style.display = (currentUser.role === 'admin' || createdBy == currentUser.id_user) && type !== 'private' ? 'flex' : 'none';

        messagesStream.innerHTML = "";
        socket.emit('join_room_pool', { room_id: roomId });
        socket.emit('get_room_history', { room_id: roomId });
        socket.emit('get_room_participants', { room_id: roomId });
        
        document.getElementById('pane-company').classList.remove('active');
        document.getElementById('pane-participants').classList.add('active');
        document.getElementById('btn-toggle-right-view').innerText = "👥 Все сотрудники";
        document.getElementById('btn-toggle-right-view').style.background = "#4b5563";
    }

    function displayMessage(msg, isBulkLoad) {
        const isMyMessage = (msg.id_user_from == currentUser.id_user);
        const div = document.createElement('div');
        div.className = `message ${isMyMessage ? 'my' : ''}`;
        div.setAttribute('data-msg-id', msg.id_message || msg.id);

        let text = msg.encrypted_text || msg.text || "";
        const author = msg.username || "Сотрудник";
        const timeStr = msg.created_at ? new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "";

        let customStyleCSS = "";
        try {
            const styles = typeof msg.ui_styles === 'string' ? JSON.parse(msg.ui_styles || '{}') : msg.ui_styles;
            if (styles && styles.fontFamily) {
                customStyleCSS = `font-family:${styles.fontFamily}; font-size:${styles.fontSize}; color:${styles.color}; background-color:${styles.background};`;
                if (styles.isBold) customStyleCSS += "font-weight:bold;";
                if (styles.isItalic) customStyleCSS += "font-style:italic;";
            }
        } catch(e) {}

        let deleteBtnHtml = (isMyMessage || currentUser.role === 'admin') ? `<span class="msg-delete-trigger" onclick="requestDeleteMessage(${msg.id_message})">❌</span>` : "";

        div.innerHTML = `
            <div class="message-box">
                ${deleteBtnHtml}
                <div class="msg-meta"><span class="msg-author">${author}</span><span>${timeStr}</span></div>
                <div class="msg-text" style="${customStyleCSS}">${text}</div>
            </div>
        `;
        messagesStream.appendChild(div);
        messagesStream.scrollTop = messagesStream.scrollHeight;
    }

    window.requestDeleteMessage = function(msgId) {
        if (confirm("Удалить это сообщение?")) socket.emit('delete_message_request', { message_id: parseInt(msgId), room_id: parseInt(currentRoomId), user_id: currentUser.id_user, role: currentUser.role });
    };

    function initUIEventListeners() {
        // КНОПКА ПОДДЕРЖКИ СОЗДАНИЯ КОМНАТЫ
        document.getElementById('btn-create-group').addEventListener('click', () => {
            let gname = prompt("Введите название нового кабинета:");
            if (gname && gname.trim() !== "") {
                socket.emit('create_group_chat', { group_name: gname.trim() });
            }
        });

        // КНОПКА ДОБАВЛЕНИЯ СОТРУДНИКА В КОМНАТУ
        document.getElementById('btn-add-user-modal').addEventListener('click', () => {
            if (!currentRoomId) { alert("Выберите кабинет!"); return; }
            let listStr = globalUsersCache.map(u => `${u.username} (ID: ${u.id_user})`).join("\n");
            let targetName = prompt("Введите Имя сотрудника для добавления в этот кабинет:\n\nДоступные сотрудники:\n" + globalUsersCache.map(u => u.username).join(", "));
            if (targetName) {
                let found = globalUsersCache.find(u => u.username.toLowerCase() === targetName.trim().toLowerCase());
                if (found) {
                    socket.emit('add_user_to_room', { room_id: parseInt(currentRoomId), user_id: found.id_user });
                } else { alert("Сотрудник не найден!"); }
            }
        });

        document.getElementById('btn-send-message').addEventListener('click', sendMessageStream);
        inputMsg.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessageStream(); } });

        document.getElementById('btn-secret-toggle').addEventListener('click', function() {
            isSecretMode = !isSecretMode;
            if (isSecretMode) {
                this.innerHTML = "🔒 Зашифровано"; this.style.background = "#fef08a"; this.style.color = "#a16207"; this.style.fontWeight = "bold";
                let key = prompt("Введите код шифрования:");
                if (key && key.trim() !== "") userSecretKey = key.trim();
                else { isSecretMode = false; resetSecretToggleUI(this); }
            } else { resetSecretToggleUI(this); }
        });

        // Интеграция вызова родной панели смайликов
        document.getElementById('btn-emoji-trigger').addEventListener('click', () => {
            inputMsg.focus();
            if (navigator.virtualKeyboard) { navigator.virtualKeyboard.show(); }
            // Вызов нативного диалога смайликов Windows
            alert("Используйте сочетание клавиш Win + . (или Win + Ю) для вставки любого эмодзи!");
        });

        document.getElementById('font-family-select').addEventListener('change', function() { currentTextStyles.fontFamily = this.value; inputMsg.style.fontFamily = this.value; });
        document.getElementById('font-size-select').addEventListener('change', function() { currentTextStyles.fontSize = this.value; inputMsg.style.fontSize = this.value; });
        document.getElementById('style-bold').addEventListener('click', function() { currentTextStyles.isBold = !currentTextStyles.isBold; this.style.background = currentTextStyles.isBold ? '#e5e7eb' : 'transparent'; inputMsg.style.fontWeight = currentTextStyles.isBold ? 'bold' : 'normal'; });
        document.getElementById('style-italic').addEventListener('click', function() { currentTextStyles.isItalic = !currentTextStyles.isItalic; this.style.background = currentTextStyles.isItalic ? '#e5e7eb' : 'transparent'; inputMsg.style.fontStyle = currentTextStyles.isItalic ? 'italic' : 'normal'; });
        document.getElementById('text-color-picker').addEventListener('input', function() { currentTextStyles.color = this.value; inputMsg.style.color = this.value; });
        document.getElementById('text-bg-picker').addEventListener('input', function() { currentTextStyles.background = this.value; inputMsg.style.backgroundColor = this.value; });

        document.getElementById('btn-archive-room').addEventListener('click', () => { if (confirm("Архивировать переписку кабинета?")) socket.emit('archive_room_messages', { room_id: currentRoomId, user_id: currentUser.id_user, role: currentUser.role }); });
        document.getElementById('btn-delete-room').addEventListener('click', () => { if (confirm("Полностью удалить кабинет?")) socket.emit('delete_room_request', { room_id: currentRoomId, user_id: currentUser.id_user, role: currentUser.role }); });
    }

    function resetSecretToggleUI(element) { element.innerHTML = "🔓 Открыто"; element.style.background = "transparent"; element.style.color = "var(--text-main)"; element.style.fontWeight = "normal"; userSecretKey = ""; }

    function sendMessageStream() {
        const text = inputMsg.innerText.trim(); if (!text || !currentRoomId) return;
        socket.emit('send_message', { room_id: currentRoomId, text: text, is_secret: isSecretMode, ui_styles: JSON.stringify(currentTextStyles) });
        inputMsg.innerHTML = "";
    }

    function renderCurrentRoomParticipants(list) {
        const container = document.getElementById('current-room-participants'); container.innerHTML = "";
        list.forEach(p => {
            const div = document.createElement('div'); div.className = 'user-row'; div.style.cursor = 'default';
            div.innerHTML = `<div class="avatar-container"><div class="avatar" style="background:#2563eb; color:#fff;">${p.username.charAt(0).toUpperCase()}</div></div><div class="user-info-meta"><span style="font-weight:600;">${p.username}</span><span class="user-role">${p.role}</span></div>`;
            container.appendChild(div);
        });
    }

    function renderCompanyUsers(users) {
        const container = document.getElementById('company-users-list'); container.innerHTML = "";
        users.forEach(u => {
            if (u.id_user === currentUser.id_user) return;
            const div = document.createElement('div'); div.className = "user-row";
            div.innerHTML = `<div class="avatar-container"><div class="avatar">${u.username.charAt(0).toUpperCase()}</div><div class="status-badge online"></div></div><div class="user-info-meta"><span style="font-weight:600;">${u.username}</span><span class="user-role">${u.role}</span></div>`;
            
            // ИСПРАВЛЕНО: Клик по сотруднику теперь гарантированно инициирует создание приватного чата
            div.addEventListener('click', () => {
                socket.emit('create_private_chat', { target_user_id: u.id_user, target_username: u.username });
            });
            container.appendChild(div);
        });
    }

    function initMentionLogic() {
        const mentionMenu = document.getElementById('mention-menu');
        inputMsg.addEventListener('input', function(e) {
            const text = inputMsg.innerText; const selection = window.getSelection();
            if (!selection.rangeCount) return;
            const caretPos = selection.getRangeAt(0).startOffset; const textBeforeCaret = text.substring(0, caretPos); const lastAtIndex = textBeforeCaret.lastIndexOf('@');
            if (lastAtIndex !== -1 && (lastAtIndex === 0 || textBeforeCaret[lastAtIndex - 1] === ' ')) {
                const query = textBeforeCaret.substring(lastAtIndex + 1).toLowerCase();
                const filtered = roomParticipantsCache.filter(p => p.id_user !== currentUser.id_user && p.username.toLowerCase().includes(query));
                if (filtered.length > 0) { renderMentionMenu(filtered, lastAtIndex, caretPos); }
                else { mentionMenu.style.display = 'none'; isMentionMenuOpen = false; }
            } else { mentionMenu.style.display = 'none'; isMentionMenuOpen = false; }
        });
    }

    function renderMentionMenu(users, addIndex, caretPos) {
        const mentionMenu = document.getElementById('mention-menu'); mentionMenu.innerHTML = ""; mentionMenu.style.display = 'block'; isMentionMenuOpen = true;
        users.forEach(u => {
            const div = document.createElement('div'); div.className = 'mention-item'; div.innerText = `@${u.username}`;
            div.addEventListener('click', function() { insertMentionIntoInput(u.username, u.id_user, addIndex, caretPos); });
            mentionMenu.appendChild(div);
        });
    }

    function insertMentionIntoInput(username, userId, addIndex, caretPos) {
        const mentionMenu = document.getElementById('mention-menu'); const text = inputMsg.innerText; const beforeAt = text.substring(0, addIndex); const afterCaret = text.substring(caretPos);
        inputMsg.innerHTML = beforeAt + `<span class="mention" data-user-id="${userId}" style="color:var(--primary-color); font-weight:bold; background:#eff6ff; padding:2px 4px; border-radius:4px;">@${username}</span>&nbsp;` + afterCaret;
        mentionMenu.style.display = 'none'; isMentionMenuOpen = false; inputMsg.focus();
        const range = document.createRange(); const sel = window.getSelection(); range.selectNodeContents(inputMsg); range.collapse(false); sel.removeAllRanges(); sel.addRange(range);
    }

    window.onload = initApplication;
</script>
</body>
</html>
