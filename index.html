<!DOCTYPE html>
<html lang="ru">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta charset="UTF-8">
    <title>1C Chat Client</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { height: 100vh; display: flex; flex-direction: column; background-color: #f3f4f6; overflow: hidden; }
        .header { background-color: #2563eb; color: white; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .header h1 { font-size: 12px; }
        .header-controls { display: flex; align-items: center; gap: 8px; }
        .user-info { font-size: 11px; }
        
        .main-container { flex: 1; display: flex; overflow: hidden; min-height: 0; }
        .sidebar { width: 200px; background-color: white; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; overflow: hidden; }
        .sidebar-section { flex: 1; padding: 6px; overflow-y: auto; }
        .sidebar h3 { font-size: 10px; font-weight: bold; color: #374151; margin-bottom: 6px; }
        
        .room-item { padding: 4px 5px; margin-bottom: 2px; cursor: pointer; font-size: 10px; border-radius: 3px; }
        .room-item:hover { background-color: #f3f4f6; }
        .room-item.active { background-color: #dbeafe; color: #1e40af; font-weight: bold; }
        
        .btn-small { padding: 1px 4px; font-size: 9px; background-color: #10b981; color: white; border: none; border-radius: 3px; cursor: pointer; float: right; }
        .btn-danger-xs { padding: 1px 4px; font-size: 8px; background-color: #ef4444; color: white; border: none; border-radius: 2px; cursor: pointer; float: right; margin-left: 4px; }
        
        .chat-window { flex: 1; display: flex; flex-direction: column; background-color: #f9fafb; overflow: hidden; }
        .chat-header { padding: 6px 10px; background: white; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-weight: bold; flex-shrink: 0; }
        .chat-actions { display: flex; gap: 4px; }
        
        .messages-container { flex: 1; padding: 8px; overflow-y: auto; display: flex; flex-direction: column; }
        .msg-block { background-color: white; padding: 5px 8px; border-radius: 5px; max-width: 80%; margin-bottom: 5px; align-self: flex-start; }
        .msg-author { font-size: 8px; color: #6b7280; font-weight: bold; display: block; margin-bottom: 2px; }
        .msg-text { font-size: 10px; color: #1f2937; word-break: break-word; }
        
        .participants-panel { width: 180px; background-color: white; display: flex; flex-direction: column; padding: 6px; overflow-y: auto; border-left: 1px solid #e5e7eb; }
        .participants-panel h3 { font-size: 10px; font-weight: bold; color: #374151; margin-bottom: 4px; border-bottom: 1px solid #e5e7eb; padding-bottom: 2px; }
        .participants-panel h3.employees-title { margin-top: 8px; }
        .participant-item { padding: 2px 3px; font-size: 9px; color: #4b5563; line-height: 14px; clear: both; }
        .user-item { padding: 2px 3px; font-size: 9px; border-bottom: 1px dashed #f3f4f6; }

        .input-panel { padding: 6px; background-color: white; border-top: 1px solid #e5e7eb; flex-shrink: 0; }
        .secret-row { margin-bottom: 4px; display: flex; gap: 6px; align-items: center; }
        .btn-secret { padding: 2px 6px; font-size: 9px; background-color: #e5e7eb; border: none; border-radius: 9999px; cursor: pointer; }
        .btn-secret.active { background-color: #eab308; color: white; }
        .controls-row { display: flex; gap: 5px; align-items: center; }
        .btn-file, .btn-screenshot { background-color: #e5e7eb; border: none; padding: 4px 6px; border-radius: 3px; cursor: pointer; font-size: 10px; }
        
        .input-msg-textarea { flex: 1; border: 1px solid #d1d5db; border-radius: 3px; padding: 4px; font-size: 10px; resize: none; font-family: Arial, sans-serif; background: white; outline: none; height: 40px; }
        
        .btn-send { background-color: #2563eb; color: white; border: none; padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 10px; height: 40px; }
        .file-link { color: #2563eb; text-decoration: underline; cursor: pointer; }
        img { max-width: 100%; max-height: 100px; border-radius: 3px; cursor: pointer; display: block; margin-top: 3px; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-body { background: white; padding: 12px; border-radius: 6px; width: 350px; max-width: 90%; }
        .modal-body h4 { font-size: 12px; margin-bottom: 8px; }
        .modal-body input, .modal-body textarea { width: 100%; padding: 5px; font-size: 10px; margin-bottom: 8px; outline: none; border: 1px solid #d1d5db; }
        .modal-body textarea { height: 80px; font-family: monospace; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }
        
        .toast-msg { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 4px 10px; border-radius: 15px; font-size: 10px; z-index: 2000; display: none; }
    </style>
</head>
<body>

<div class="header">
    <h1>1C Corporate Chat</h1>
    <div class="header-controls">
        <div id="custom-links-container" style="display:flex; gap:6px;"></div>
        <button onclick="quickLogin('Admin', '00000000-0000-0000-0000-000000000001', 'Администратор', 'admin')" style="padding:1px 5px; font-size:9px; background:#eab308; border:none; border-radius:3px; cursor:pointer;">Админ</button>
        <button onclick="quickLogin('User1', '00000000-0000-0000-0000-000000000001', 'Сотрудник', 'user')" style="padding:1px 5px; font-size:9px; background:#10b981; border:none; border-radius:3px; cursor:pointer;">Пользователь</button>
        <span id="user-info" class="user-info">Не авторизован</span>
    </div>
</div>

<div class="main-container">
    <div class="sidebar">
        <div class="sidebar-section">
            <h3>📁 Кабинеты <button id="btn-create-group" class="btn-small">+</button></h3>
            <div id="rooms-list">Загрузка...</div>
        </div>
    </div>

    <div class="chat-window">
        <div class="chat-header">
            <span id="current-chat-title">Выберите чат</span>
            <div class="chat-actions" id="chat-management-actions" style="display: none;">
                <button onclick="triggerArchive()" class="btn-small" style="background:#eab308; float:none;">📦</button>
                <button onclick="triggerDeleteRoom()" class="btn-small" style="background:#ef4444; float:none;">🗑</button>
            </div>
        </div>

        <div id="messages-container" class="messages-container">
            <div class="msg-block"><span class="msg-author">Система</span><div class="msg-text">Выберите чат</div></div>
        </div>
        
        <div class="input-panel">
            <div class="secret-row">
                <button id="btn-secret" class="btn-secret">🔒 Шифровать</button>
                <button id="btn-screenshot" class="btn-screenshot">📸 Скриншот</button>
            </div>
            <div class="controls-row">
                <input type="file" id="file-input" style="display:none">
                <button id="btn-file" class="btn-file">📎</button>
                <textarea id="input-msg" class="input-msg-textarea" placeholder="Сообщение..."></textarea>
                <button id="btn-send" class="btn-send">📤</button>
            </div>
        </div>
    </div>

    <div class="participants-panel">
        <h3>👥 В кабинете <button id="btn-add-participant" class="btn-small" style="display:none;">+</button></h3>
        <div id="participants-list">Не выбран чат</div>
        
        <h3 class="employees-title">👤 Сотрудники <button id="btn-start-private" class="btn-small" style="background:#2563eb;">💬</button></h3>
        <div id="users-list-right">Загрузка...</div>
    </div>
</div>

<div id="toast" class="toast-msg"></div>

<!-- Модальные окна -->
<div class="modal-overlay" id="screenshot-modal">
    <div class="modal-body">
        <h4>📸 Вставка скриншота</h4>
        <p style="font-size:9px; color:#666; margin-bottom:6px;">1. PrintScreen<br>2. Ctrl+V в поле ниже<br>3. Отправить</p>
        <textarea id="screenshot-field" placeholder="Нажмите Ctrl+V здесь..."></textarea>
        <div class="modal-buttons">
            <button onclick="closeScreenshotModal()">Отмена</button>
            <button id="screenshot-submit-btn" style="background:#2563eb;color:white;">Отправить</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="user-select-modal">
    <div class="modal-body">
        <h4 id="modal-action-title">Выберите сотрудника</h4>
        <select id="modal-user-dropdown"></select>
        <div class="modal-buttons">
            <button onclick="closeUserModal()">Отмена</button>
            <button id="modal-submit-btn" style="background:#2563eb;color:white;">Выбрать</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="secret-input-modal">
    <div class="modal-body">
        <h4>🔑 Ключ шифрования</h4>
        <input type="password" id="modal-secret-field" placeholder="Ключ" />
        <div class="modal-buttons">
            <button onclick="closeSecretModal()">Отмена</button>
            <button id="secret-modal-submit-btn" style="background:#eab308;">Применить</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="text-input-modal">
    <div class="modal-body">
        <h4>📝 Название кабинета</h4>
        <input type="text" id="modal-text-field" placeholder="Название" />
        <div class="modal-buttons">
            <button onclick="closeTextModal()">Отмена</button>
            <button id="text-modal-submit-btn" style="background:#10b981;color:white;">Создать</button>
        </div>
    </div>
</div>

<script>
// Глобальные переменные
var currentRoomId = null;
var currentRoomType = "";
var currentRoomCreator = "";
var isSecretMode = false;
var userSecretKey = "";
var currentUserId = "";
var currentUserRole = "";
var currentUserName = "";
var currentOrgId = "";
var globalUsersCache = [];
var globalRoomsCache = [];
var updateInterval = null;
var originalTitle = document.title;
var titleBlinkInterval = null;
var lastMessageId = 0;
var isUnloading = false;

// Элементы
var inputMsg = document.getElementById('input-msg');
var messagesContainer = document.getElementById('messages-container');

function showToast(msg, isError) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.background = isError ? '#ef4444' : '#333';
    toast.style.display = 'block';
    setTimeout(function() { toast.style.display = 'none'; }, 2000);
}

function playNotificationSound() {
    try {
        var snd = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==");
        snd.play();
    } catch(e) {}
}

function startTitleBlink(authorName) {
    if (titleBlinkInterval) clearInterval(titleBlinkInterval);
    playNotificationSound();
    var isOldTitle = true;
    titleBlinkInterval = setInterval(function() {
        if (isUnloading) return;
        document.title = isOldTitle ? "🔔 " + authorName.toUpperCase() : originalTitle;
        isOldTitle = !isOldTitle;
    }, 800);
}

function stopTitleBlink() {
    if (titleBlinkInterval) { clearInterval(titleBlinkInterval); titleBlinkInterval = null; }
    document.title = originalTitle;
}

function cleanupResources() {
    isUnloading = true;
    stopTitleBlink();
    if (updateInterval) {
        clearInterval(updateInterval);
        updateInterval = null;
    }
    var highestTimeoutId = setTimeout(function(){}, 0);
    for (var i = 0; i < highestTimeoutId; i++) {
        clearTimeout(i);
    }
}

window.onbeforeunload = function() {
    cleanupResources();
};

function quickLogin(id_user, id_org, username, user_role) {
    applyAuth(id_user, id_org, username, user_role);
}

// AJAX запрос с обработкой ошибок
function ajaxRequest(method, url, data, callback) {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open(method, url, true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && !isUnloading) {
                if (xhr.status === 200) {
                    try {
                        var response = JSON.parse(xhr.responseText);
                        if (callback) callback(null, response);
                    } catch(e) {
                        if (callback) callback(e, null);
                    }
                } else {
                    if (callback) callback(new Error('HTTP ' + xhr.status), null);
                }
            }
        };
        xhr.onerror = function() {
            if (callback) callback(new Error('Network error'), null);
        };
        xhr.send(data ? JSON.stringify(data) : null);
    } catch(e) {
        if (callback) callback(e, null);
    }
}

function applyAuth(id_user, id_org, username, user_role) {
    cleanupResources();
    
    currentUserId = id_user;
    currentUserRole = user_role || 'user';
    currentUserName = username;
    currentOrgId = id_org;
    
    var userInfoEl = document.getElementById('user-info');
    if (userInfoEl) {
        userInfoEl.innerHTML = username + (currentUserRole === 'admin' ? ' 👑' : '');
    }
    
    // Регистрируем пользователя через API
    ajaxRequest('POST', '/api/auth', {
        id_user: id_user,
        id_org: id_org,
        username: username,
        role: currentUserRole
    }, function(err, res) {
        if (!err && res && res.success) {
            loadRooms();
            loadUsers();
            startPolling();
        } else {
            showToast("Ошибка авторизации", true);
        }
    });
}

function startPolling() {
    if (updateInterval) clearInterval(updateInterval);
    updateInterval = setInterval(function() {
        if (!isUnloading && currentRoomId) {
            checkNewMessages();
        }
        if (!isUnloading) {
            loadRooms(); // Обновляем список комнат
        }
    }, 3000);
}

function checkNewMessages() {
    if (!currentRoomId) return;
    ajaxRequest('GET', '/api/messages?room_id=' + currentRoomId + '&after=' + lastMessageId, null, function(err, res) {
        if (!err && res && res.messages && res.messages.length > 0) {
            for (var i = 0; i < res.messages.length; i++) {
                var msg = res.messages[i];
                displayMessage(msg, false);
                if (msg.id_message > lastMessageId) {
                    lastMessageId = msg.id_message;
                }
                if (msg.id_user_from !== currentUserId && msg.id_room == currentRoomId) {
                    startTitleBlink(msg.username);
                }
            }
        }
    });
}

function loadRooms() {
    ajaxRequest('GET', '/api/rooms?id_org=' + encodeURIComponent(currentOrgId) + '&id_user=' + encodeURIComponent(currentUserId), null, function(err, res) {
        if (!err && res && res.rooms) {
            globalRoomsCache = res.rooms;
            renderRoomsList(res.rooms);
        }
    });
}

function loadUsers() {
    ajaxRequest('GET', '/api/users?id_org=' + encodeURIComponent(currentOrgId), null, function(err, res) {
        if (!err && res && res.users) {
            globalUsersCache = res.users;
            renderUsersRightPanel(res.users);
        }
    });
}

function loadRoomParticipants(roomId) {
    ajaxRequest('GET', '/api/room_participants?room_id=' + roomId, null, function(err, res) {
        if (!err && res && res.participants) {
            renderParticipantsList(res.participants);
        }
    });
}

function loadRoomHistory(roomId) {
    ajaxRequest('GET', '/api/messages?room_id=' + roomId, null, function(err, res) {
        if (!err && res && res.messages && messagesContainer) {
            messagesContainer.innerHTML = "";
            lastMessageId = 0;
            for (var i = 0; i < res.messages.length; i++) {
                displayMessage(res.messages[i], true);
                if (res.messages[i].id_message > lastMessageId) {
                    lastMessageId = res.messages[i].id_message;
                }
            }
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    });
}

function selectRoomById(roomId) {
    if (isUnloading) return;
    currentRoomId = roomId;
    stopTitleBlink();
    loadRoomHistory(roomId);
    loadRoomParticipants(roomId);
    
    // Обновляем активный класс в списке
    var rooms = document.querySelectorAll('.room-item');
    for (var i = 0; i < rooms.length; i++) {
        var room = rooms[i];
        if (room.getAttribute('data-id') == roomId) {
            room.classList.add('active');
        } else {
            room.classList.remove('active');
        }
    }
}

function renderRoomsList(rooms) {
    if (isUnloading) return;
    var container = document.getElementById('rooms-list');
    if (!container) return;
    container.innerHTML = "";
    if (!rooms || rooms.length === 0) { 
        container.innerHTML = "<div style='font-size:10px; color:#999;'>Нет чатов</div>"; 
        return; 
    }
    for (var i = 0; i < rooms.length; i++) {
        var room = rooms[i];
        var div = document.createElement('div');
        div.className = 'room-item' + (room.id_room == currentRoomId ? ' active' : '');
        div.setAttribute('data-id', room.id_room);
        var icon = (room.type === 'private') ? '💬 ' : ((room.type === 'admin_group') ? '👑 ' : '👥 ');
        div.innerText = icon + room.name;
        
        if (room.id_room == currentRoomId) {
            currentRoomType = room.type;
            currentRoomCreator = room.created_by;
            var titleEl = document.getElementById('current-chat-title');
            if (titleEl) titleEl.innerText = room.name;
            
            var mgtActions = document.getElementById('chat-management-actions');
            if (mgtActions) {
                if (room.type === 'private') mgtActions.style.display = 'none';
                else mgtActions.style.display = (currentUserRole === 'admin' || room.created_by == currentUserId) ? 'flex' : 'none';
            }

            var btnAdd = document.getElementById('btn-add-participant');
            if (btnAdd) {
                if (room.type === 'private') btnAdd.style.display = 'none';
                else if (room.type === 'admin_group') btnAdd.style.display = (currentUserRole === 'admin') ? 'inline-block' : 'none';
                else btnAdd.style.display = 'inline-block';
            }
        }
        
        (function(r) {
            div.onclick = function() {
                if (isUnloading) return;
                selectRoomById(r.id_room);
            };
        })(room);
        container.appendChild(div);
    }
}

function renderUsersRightPanel(users) {
    if (isUnloading) return;
    var container = document.getElementById('users-list-right');
    if (!container) return;
    container.innerHTML = "";
    for (var i = 0; i < users.length; i++) {
        var u = users[i];
        if (u.id_user == currentUserId) continue;
        var div = document.createElement('div');
        div.className = 'user-item';
        div.innerText = "• " + u.username + (u.role === 'admin' ? ' (Админ)' : '');
        container.appendChild(div);
    }
}

function renderParticipantsList(list) {
    if (isUnloading) return;
    var container = document.getElementById('participants-list');
    if (!container) return;
    container.innerHTML = "";
    if (!list || list.length === 0) { 
        container.innerHTML = "<div style='font-size:9px; color:#999;'>Только вы</div>"; 
        return; 
    }
    for (var i = 0; i < list.length; i++) {
        var p = list[i];
        var div = document.createElement('div');
        div.className = 'participant-item';
        div.innerText = "• " + p.username;
        
        if (currentRoomType !== 'private' && p.id_user != currentUserId) {
            if (currentUserRole === 'admin' || currentRoomCreator == currentUserId) {
                var btnKick = document.createElement('button');
                btnKick.className = 'btn-danger-xs';
                btnKick.innerText = 'Выгнать';
                (function(targetId) {
                    btnKick.onclick = function() {
                        if (!isUnloading && confirm("Исключить сотрудника?")) {
                            ajaxRequest('POST', '/api/remove_from_room', {
                                room_id: currentRoomId,
                                user_id: targetId,
                                admin_id: currentUserId
                            }, function(err, res) {
                                if (!err && res && res.success) {
                                    loadRoomParticipants(currentRoomId);
                                    loadRooms();
                                }
                            });
                        }
                    };
                })(p.id_user);
                div.appendChild(btnKick);
            }
        }
        container.appendChild(div);
    }
}

function sendMessage() {
    if (isUnloading) return;
    var text = inputMsg ? inputMsg.value.trim() : "";
    if (!text || !currentRoomId) return;
    
    var finalText = text;
    try {
        if (isSecretMode && userSecretKey && userSecretKey.length > 0) {
            var encrypted = CryptoJS.AES.encrypt(text, userSecretKey).toString();
            finalText = "SECRET:" + encrypted;
        }
    } catch(e) {
        showToast("Ошибка шифрования", true);
    }
    
    ajaxRequest('POST', '/api/send_message', {
        room_id: currentRoomId,
        text: finalText,
        is_secret: isSecretMode,
        id_user_from: currentUserId,
        username: currentUserName
    }, function(err, res) {
        if (!err && res && res.success) {
            inputMsg.value = "";
            inputMsg.focus();
            checkNewMessages();
        } else {
            showToast("Ошибка отправки", true);
        }
    });
}

function uploadFile(file) {
    if (isUnloading) return;
    try {
        var fd = new FormData();
        fd.append('file', file);
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/upload', true);
        xhr.onload = function() {
            if (xhr.status === 200 && !isUnloading) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    if (data && data.url && currentRoomId) {
                        var isImg = /\.(jpg|jpeg|png|gif|webp)$/i.test(file.name);
                        var absoluteUrl = window.location.protocol + '//' + window.location.host + data.url;
                        var content = isImg ? 
                            '<img src="'+absoluteUrl+'" onclick="window.open(\''+absoluteUrl+'\')" />' : 
                            '<a href="#" onclick="downloadFile(\''+data.url+'\', \''+file.name+'\'); return false;" style="color:#2563eb;">📄 '+file.name+'</a>';
                        
                        ajaxRequest('POST', '/api/send_message', {
                            room_id: currentRoomId,
                            text: content,
                            is_secret: false,
                            id_user_from: currentUserId,
                            username: currentUserName
                        }, function(err, res) {
                            if (!err && res && res.success) {
                                checkNewMessages();
                                showToast("Файл отправлен");
                            }
                        });
                    }
                } catch(e) { 
                    showToast("Ошибка", true); 
                }
            } else { 
                showToast('Ошибка отправки', true); 
            }
        };
        xhr.onerror = function() { 
            showToast('Ошибка сети', true); 
        };
        xhr.send(fd);
    } catch(e) { 
        showToast('Ошибка: ' + e.message, true); 
    }
}

function downloadFile(url, filename) {
    if (isUnloading) return;
    var fullUrl = window.location.protocol + '//' + window.location.host + url;
    window.open(fullUrl, '_blank');
    return false;
}

// Скриншот
var screenshotModal = document.getElementById('screenshot-modal');
var screenshotField = document.getElementById('screenshot-field');

function openScreenshotModal() {
    if (isUnloading) return;
    screenshotField.value = "";
    screenshotModal.style.display = 'flex';
    screenshotField.focus();
}

function closeScreenshotModal() {
    screenshotModal.style.display = 'none';
}

function sendScreenshotFromBase64(base64String) {
    if (isUnloading || !currentRoomId) {
        showToast("Сначала выберите чат", true);
        return;
    }
    
    var cleanBase64 = base64String;
    if (base64String.indexOf('src="') !== -1) {
        var match = base64String.match(/src="([^"]+)"/);
        if (match && match[1]) cleanBase64 = match[1];
    }
    
    var imgHtml = '<img src="'+cleanBase64+'" style="max-width:100%; max-height:120px;" onclick="window.open(this.src)" />';
    ajaxRequest('POST', '/api/send_message', {
        room_id: currentRoomId,
        text: imgHtml,
        is_secret: false,
        id_user_from: currentUserId,
        username: currentUserName
    }, function(err, res) {
        if (!err && res && res.success) {
            checkNewMessages();
            showToast("Скриншот отправлен");
        } else {
            showToast("Ошибка", true);
        }
    });
}

if (screenshotField) {
    screenshotField.onpaste = function() {
        setTimeout(function() {
            if (isUnloading) return;
            var val = screenshotField.value;
            if (val && (val.indexOf('data:image') !== -1 || val.indexOf('base64') !== -1)) {
                sendScreenshotFromBase64(val);
                closeScreenshotModal();
            }
        }, 50);
    };
}

document.getElementById('screenshot-submit-btn').onclick = function() {
    var val = screenshotField.value.trim();
    if (val) {
        sendScreenshotFromBase64(val);
        closeScreenshotModal();
    } else {
        showToast("Вставьте скриншот (Ctrl+V)", true);
    }
};

function displayMessage(msg, isBulkLoad) {
    if (isUnloading) return;
    try {
        if (!messagesContainer) return;
        var div = document.createElement('div');
        div.className = 'msg-block';
        
        var text = String(msg.encrypted_text || msg.text || "");
        var author = String(msg.username || "Сотрудник");
        var isUserEncrypted = msg.is_user_encrypted || false;

        if (isUserEncrypted || text.indexOf("SECRET:") === 0) {
            var cipher = text.replace("SECRET:", "").replace(/<\/?[^>]+(>|$)/g, "").trim();
            var uniqueId = 'c_' + Math.random().toString(36).substr(2, 6);
            
            text = '<div style="color:#eab308;">🔒 Зашифровано</div><div id="'+uniqueId+'" data-cipher="'+cipher+'">[Скрыто]</div>' +
                   '<button class="btn-small" style="float:none; margin-top:3px; background:#eab308;" onclick="decryptMsg(\''+uniqueId+'\')">Расшифровать</button>';
        }
        
        div.innerHTML = '<span class="msg-author">' + author + '</span><div class="msg-text">' + text + '</div>';
        messagesContainer.appendChild(div);
        if (!isBulkLoad) messagesContainer.scrollTop = messagesContainer.scrollHeight;
    } catch(e) { }
}

window.decryptMsg = function(elementId) {
    if (isUnloading) return;
    var targetElement = document.getElementById(elementId);
    if (!targetElement) return;
    var cipher = targetElement.getAttribute("data-cipher");
    
    openSecretModal(function(enteredKey) {
        try {
            var decryptedBytes = CryptoJS.AES.decrypt(cipher, enteredKey);
            var clearText = decryptedBytes.toString(CryptoJS.enc.Utf8);
            if (clearText) {
                targetElement.innerHTML = clearText;
                targetElement.style.cssText = "color:#1f2937; font-weight:bold;";
            } else { 
                showToast("Неверный ключ!", true); 
            }
        } catch(e) { 
            showToast("Ошибка!", true); 
        }
    });
};

// Модальные окна
function openUserModal(title, callback) {
    if (isUnloading) return;
    document.getElementById('modal-action-title').innerText = title;
    var dropdown = document.getElementById('modal-user-dropdown');
    dropdown.innerHTML = "";
    for (var i = 0; i < globalUsersCache.length; i++) {
        var option = document.createElement('option');
        option.value = globalUsersCache[i].id_user;
        option.innerText = globalUsersCache[i].username;
        dropdown.appendChild(option);
    }
    document.getElementById('user-select-modal').style.display = 'flex';
    document.getElementById('modal-submit-btn').onclick = function() {
        if (!isUnloading) callback(dropdown.value);
        closeUserModal();
    };
}

function closeUserModal() { 
    document.getElementById('user-select-modal').style.display = 'none'; 
}

function openSecretModal(callback) {
    if (isUnloading) return;
    var field = document.getElementById('modal-secret-field');
    field.value = "";
    document.getElementById('secret-input-modal').style.display = 'flex';
    document.getElementById('secret-modal-submit-btn').onclick = function() {
        var val = field.value.trim();
        if (val !== "") {
            callback(val);
        }
        closeSecretModal();
    };
}

function closeSecretModal() { 
    document.getElementById('secret-input-modal').style.display = 'none'; 
}

function openTextModal(title, callback) {
    if (isUnloading) return;
    document.getElementById('text-modal-title').innerText = title;
    var field = document.getElementById('modal-text-field');
    field.value = "";
    document.getElementById('text-input-modal').style.display = 'flex';
    document.getElementById('text-modal-submit-btn').onclick = function() {
        var val = field.value.trim();
        if (val !== "") {
            callback(val);
        }
        closeTextModal();
    };
}

function closeTextModal() { 
    document.getElementById('text-input-modal').style.display = 'none'; 
}

// Обработчики кнопок
document.getElementById('btn-send').onclick = sendMessage;
document.getElementById('btn-screenshot').onclick = openScreenshotModal;
document.getElementById('btn-file').onclick = function() { 
    if (!isUnloading) document.getElementById('file-input').click(); 
};
document.getElementById('file-input').onchange = function(e) { 
    if (!isUnloading && e.target.files && e.target.files[0]) {
        uploadFile(e.target.files[0]);
    }
    this.value = ""; 
};

document.getElementById('btn-add-participant').onclick = function() {
    if (isUnloading || !currentRoomId) return;
    openUserModal("Добавить сотрудника", function(selectedUserId) {
        ajaxRequest('POST', '/api/add_to_room', {
            room_id: currentRoomId,
            user_id: selectedUserId,
            admin_id: currentUserId
        }, function(err, res) {
            if (!err && res && res.success) {
                loadRoomParticipants(currentRoomId);
                loadRooms();
            }
        });
    });
};

document.getElementById('btn-start-private').onclick = function() {
    if (isUnloading) return;
    openUserModal("Начать диалог", function(selectedUserId) {
        var targetUser = null;
        for (var i = 0; i < globalUsersCache.length; i++) {
            if (globalUsersCache[i].id_user == selectedUserId) {
                targetUser = globalUsersCache[i];
                break;
            }
        }
        if (targetUser) {
            ajaxRequest('POST', '/api/create_private_chat', {
                id_org: currentOrgId,
                user1_id: currentUserId,
                user1_name: currentUserName,
                user2_id: targetUser.id_user,
                user2_name: targetUser.username
            }, function(err, res) {
                if (!err && res && res.room_id) {
                    loadRooms();
                    selectRoomById(res.room_id);
                }
            });
        }
    });
};

document.getElementById('btn-create-group').onclick = function() {
    if (isUnloading) return;
    openTextModal("Название кабинета", function(roomName) {
        ajaxRequest('POST', '/api/create_group', {
            id_org: currentOrgId,
            name: roomName,
            created_by: currentUserId,
            creator_name: currentUserName,
            is_admin: (currentUserRole === 'admin')
        }, function(err, res) {
            if (!err && res && res.room_id) {
                loadRooms();
                selectRoomById(res.room_id);
            }
        });
    });
};

document.getElementById('btn-secret').onclick = function() {
    if (isUnloading) return;
    if (!isSecretMode) {
        openSecretModal(function(enteredKey) {
            userSecretKey = enteredKey;
            isSecretMode = true;
            document.getElementById('btn-secret').className = 'btn-secret active';
            showToast("Шифрование включено");
        });
    } else {
        isSecretMode = false;
        userSecretKey = "";
        document.getElementById('btn-secret').className = 'btn-secret';
        showToast("Шифрование выключено");
    }
};

function triggerDeleteRoom() {
    if (isUnloading || !currentRoomId) return;
    if (confirm("Удалить кабинет?")) {
        ajaxRequest('POST', '/api/delete_room', {
            room_id: currentRoomId,
            admin_id: currentUserId
        }, function(err, res) {
            if (!err && res && res.success) {
                if (messagesContainer) messagesContainer.innerHTML = "";
                var titleEl = document.getElementById('current-chat-title');
                if (titleEl) titleEl.innerText = "Выберите чат";
                var mgtActions = document.getElementById('chat-management-actions');
                if (mgtActions) mgtActions.style.display = 'none';
                currentRoomId = null;
                loadRooms();
            }
        });
    }
}

function triggerArchive() {
    if (isUnloading || !currentRoomId) return;
    if (confirm("Выгрузить историю?")) {
        ajaxRequest('POST', '/api/archive_room', {
            room_id: currentRoomId,
            admin_id: currentUserId
        }, function(err, res) {
            if (!err && res && res.archive_data) {
                var jsonString = JSON.stringify(res.archive_data, null, 2);
                var blob = new Blob([jsonString], {type: "application/json;charset=utf-8"});
                if (window.navigator && window.navigator.msSaveOrOpenBlob) {
                    window.navigator.msSaveOrOpenBlob(blob, "archive_room_" + currentRoomId + ".json");
                } else {
                    var downloadAnchor = document.createElement('a');
                    downloadAnchor.href = URL.createObjectURL(blob);
                    downloadAnchor.download = "archive_room_" + currentRoomId + ".json";
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    setTimeout(function() { if(downloadAnchor.parentNode) downloadAnchor.parentNode.removeChild(downloadAnchor); }, 100);
                }
                loadRoomHistory(currentRoomId);
                showToast("История выгружена");
            }
        });
    }
}

// Отправка по Enter
if (inputMsg) {
    inputMsg.onkeydown = function(e) {
        if (isUnloading) return;
        var ev = e || window.event;
        if (ev && ev.keyCode === 13 && !ev.shiftKey) {
            if (ev.preventDefault) ev.preventDefault();
            ev.returnValue = false;
            sendMessage();
            return false;
        }
    };
}

// Загрузка темы
function loadCustomTheme() {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/api/admin/settings', true);
        xhr.onload = function() {
            if (xhr.status === 200 && !isUnloading) {
                try {
                    var settings = JSON.parse(xhr.responseText);
                    if (settings && settings.theme_primary_color && settings.theme_primary_color.value) {
                        var headerEl = document.querySelector('.header');
                        if (headerEl) headerEl.style.backgroundColor = settings.theme_primary_color.value;
                        var btnSendEl = document.getElementById('btn-send');
                        if (btnSendEl) btnSendEl.style.backgroundColor = settings.theme_primary_color.value;
                    }
                } catch(e) {}
            }
        };
        xhr.send();
    } catch(e) {}
}

loadCustomTheme();
