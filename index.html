<!DOCTYPE html>
<html lang="ru">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta charset="UTF-8">
    <title>1C Chat Client</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <link rel="stylesheet" href="/style.css">
</head>
<body oncontextmenu="if (window.event) { window.event.returnValue = false; } return false;">

<div class="header">
    <h1>Корпоративный чат 1С</h1>
    <div class="header-controls">
        <div id="custom-links-container" class="header-links"></div>
        <span id="user-info" class="user-info">Авторизация...</span>
    </div>
</div>

<div class="main-container">
    <div class="sidebar">
        <div class="sidebar-section">
            <h3>Кабинеты <button id="btn-create-group" class="btn-small">+ Кабинет</button></h3>
            <div id="rooms-list">Загрузка...</div>
        </div>
    </div>

    <div class="chat-window" id="chat-window">
        <div class="chat-header">
            <span id="current-chat-title">Выберите кабинет или сотрудника</span>
            <div class="chat-actions" id="chat-management-actions" style="display: none;">
                <button onclick="triggerArchive(); return false;" class="btn-small" style="background:#eab308;">📦 В архив</button>
                <button onclick="triggerDeleteRoom(); return false;" class="btn-small" style="background:#ef4444;">❌ Удалить</button>
            </div>
        </div>

        <div id="messages-container" class="messages-container">
            <div class="message"><div class="message-content"><span class="msg-author">Система</span><div class="msg-text">Выберите чат для начала общения.</div></div></div>
        </div>
        
        <div class="input-panel">
            <div class="secret-row">
                <button id="btn-secret" class="btn-secret">🔒 Обычный режим</button>
                <button id="btn-paste-screen" class="btn-small" style="background:#6b7280; margin-left:6px;">📋 Вставить скриншот</button>
            </div>
            <div class="controls-row">
                <input type="file" id="file-input" style="display:none">
                <button id="btn-file" class="btn-file">📎</button>
                <div id="input-msg" class="input-msg-div" contenteditable="true"></div>
                <button id="btn-send" class="btn-send">Отправить</button>
            </div>
        </div>
    </div>

    <div class="participants-panel">
        <h3>В кабинете <button id="btn-add-participant" class="btn-small" style="display:none;">+</button></h3>
        <div id="participants-list">Не выбран чат</div>
        
        <h3>Сотрудники компании</h3>
        <div id="users-list-right">Загрузка...</div>
    </div>
</div>

<div id="custom-context-menu" style="display:none; position:fixed; z-index:10000; background:#ffffff; border:1px solid #d1d5db; border-radius:6px; box-shadow:0 4px 6px -1px rgba(0,0,0,0.1); padding:4px 0; width:160px; font-family:Arial, sans-serif;">
    <div id="ctx-delete-msg" style="padding:8px 12px; font-size:12px; color:#ef4444; cursor:pointer;" onmouseover="this.style.background='#f3f4f6'" onmouseout="this.style.background='transparent'">❌ Удалить сообщение</div>
</div>

<div class="modal-overlay" id="user-select-modal">
    <div class="modal-body">
        <h4 id="modal-action-title">Выберите сотрудника</h4>
        <select id="modal-user-dropdown"></select>
        <div class="modal-buttons">
            <button onclick="closeUserModal()" class="btn-small" style="background:#9ca3af;">Отмена</button>
            <button id="modal-submit-btn" class="btn-small">Выбрать</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="secret-input-modal">
    <div class="modal-body">
        <h4 id="secret-modal-title">Ключ шифрования</h4>
        <input type="password" id="modal-secret-field" placeholder="Ключ..." />
        <div class="modal-buttons">
            <button onclick="closeSecretModal()" class="btn-small" style="background:#9ca3af;">Отмена</button>
            <button id="secret-modal-submit-btn" class="btn-small" style="background:#eab308;">Применить</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="text-input-modal">
    <div class="modal-body">
        <h4 id="text-modal-title">Имя нового кабинета</h4>
        <input type="text" id="modal-text-field" placeholder="Название..." />
        <div class="modal-buttons">
            <button onclick="closeTextModal()" class="btn-small" style="background:#9ca3af;">Отмена</button>
            <button id="text-modal-submit-btn" class="btn-small">Создать</button>
        </div>
    </div>
</div>

<script>
window.onerror = function() { return true; };

var socket = null;
var currentRoomId = null;
var currentRoomType = "";
var currentRoomCreator = "";
var isSecretMode = false;
var userSecretKey = "";
var currentUserId = "";
var currentUserRole = "";
var globalUsersCache = [];
var activeOnlineIds = []; 
var selectedMessageIdForCtx = null;

var inputMsg = document.getElementById('input-msg');

function selectRoomById(roomId) {
    currentRoomId = roomId;
    if (!socket) return;
    socket.emit('join_room_pool', { room_id: roomId });
    socket.emit('get_room_history', { room_id: roomId });
    socket.emit('get_room_participants', { room_id: roomId });
    socket.emit('get_rooms_again');
}

function apply1CAuth(id_user, id_org, username, user_role) {
    currentUserId = id_user;
    currentUserRole = user_role || 'user';
    
    document.getElementById('user-info').innerText = username + (currentUserRole === 'admin' ? ' 👑' : '');
    
    if (socket) {
        try { socket.disconnect(); } catch(e) {}
    }
    
    var socketUrl = window.location.protocol + '//' + window.location.host;
    socket = io(socketUrl, {
        path: '/socket.io',
        transports: ['polling', 'websocket'],
        query: { id_user: id_user, id_org: id_org, username: username, role: currentUserRole }
    });

    socket.on('connect', function() {
        socket.emit('get_users_list');
        socket.emit('get_rooms_again');
    });

    socket.on('rooms_list', function(rooms) { renderRoomsList(rooms); });
    socket.on('users_list', function(users) { globalUsersCache = users; renderUsersRightPanel(users); });
    
    socket.on('online_status_update', function(onlineIds) {
        activeOnlineIds = onlineIds || [];
        renderUsersRightPanel(globalUsersCache);
    });

    socket.on('private_chat_created', function(data) {
        if (data && data.id_room) selectRoomById(data.id_room);
    });
    
    socket.on('room_history', function(data) {
        var container = document.getElementById('messages-container');
        if (!container) return;
        container.innerHTML = "";
        if (data && data.messages) {
            for (var i = 0; i < data.messages.length; i++) { displayMessage(data.messages[i], true); }
        }
        container.scrollTop = container.scrollHeight;
    });

    socket.on('room_participants_list', function(data) { 
        renderParticipantsList(data.participants); 
    });

    socket.on('new_message', function(msg) { 
        if (msg && msg.id_room == currentRoomId) displayMessage(msg, false); 
    });
    
    socket.on('system_alert', function(data) { alert(data.message); });
    
    // ИСПРАВЛЕНО: Фокус больше не слетает при добавлении участников или создании смежных комнат!
    socket.on('refresh_rooms_trigger', function(data) { 
        socket.emit('get_rooms_again'); 
        
        // Сбрасываем интерфейс только если сервер явно прислал ID удаленной комнаты, 
        // и этот ID совпадает с нашей текущей активной комнатой
        if (data && data.deleted_room_id && currentRoomId == data.deleted_room_id) {
            currentRoomId = null;
            document.getElementById('current-chat-title').innerText = "Выберите кабинет или сотрудника";
            document.getElementById('chat-management-actions').style.display = "none";
            document.getElementById('messages-container').innerHTML = '<div class="message"><div class="message-content"><span class="msg-author">Система</span><div class="msg-text">Кабинет был удален. Выберите другой чат слева.</div></div></div>';
            document.getElementById('participants-list').innerHTML = "Не выбран чат";
        }
    });

    socket.on('message_deleted', function(data) {
        if (!data || !data.id_message) return;
        var el = document.querySelector('[data-msg-id="' + data.id_message + '"]');
        if (el) {
            el.innerHTML = '<div class="message-content" style="color:#9ca3af; font-style:italic;">Сообщение удалено автором или администратором</div>';
        }
    });

    // ИСПРАВЛЕНО: Безопасный код без динамических createElement, гарантирующий работу комнат
    socket.on('download_archive_file', function(data) {
        if (!data || !data.url) return;
        try {
            var container = document.getElementById('messages-container');
            if (!container) return;
            
            // Записываем относительный путь к архиву напрямую в глобальное окно
            window.lastArchiveUrl = data.url;
            
            // Формируем плашку и кнопку через статический HTML, понятный IE11 на 100%
            container.innerHTML = '<div style="background:#fef08a; border:1px solid #eab308; padding:12px; margin:10px; border-radius:6px; text-align:center;">' +
                                    '<b style="color:#854d0e; display:block; margin-bottom:6px;">📦 Архив переписки успешно сформирован на сервере!</b>' +
                                    '<button id="btn-save-1c-archive" style="background:#eab308; color:#fff; border:none; padding:8px 16px; border-radius:4px; font-weight:bold; cursor:pointer;">📥 СКАЧАТЬ И СОХРАНИТЬ АРХИВ</button>' +
                                  '</div>';
            
            var btn = document.getElementById('btn-save-1c-archive');
            if (btn) {
                btn.onclick = function(e) {
                    if (e && e.preventDefault) e.preventDefault();
                    if (window.event) window.event.returnValue = false;
                    
                    // Меняем текст кнопки. Этот флаг мгновенно считает 1С по таймеру
                    this.innerText = "ПЕРЕДАЧА В 1С...";
                    this.style.background = "#9ca3af";
                    
                    return false;
                };
            }
        } catch(err) {}
    });

function renderRoomsList(rooms) {
    var container = document.getElementById('rooms-list');
    if (!container) return;
    container.innerHTML = "";
    
    // Приводим ID текущего пользователя к верхнему регистру для безопасного сопоставления
    var myCleanId = currentUserId ? String(currentUserId).trim().toUpperCase() : "";

    for (var i = 0; i < rooms.length; i++) {
        var room = rooms[i];
        
        try {
            // ИСПРАВЛЕНО: Если это приватный чат, и создателем является текущий пользователь,
            // а имя чата содержит ТОЛЬКО его имя (то есть собеседник удален/вышел и остался 1 человек),
            // мы проверяем поле room.created_by, которое база данных всегда отдает на 100% стабильно!
            if (room.type === 'private' && room.created_by) {
                var creatorCleanId = String(room.created_by).trim().toUpperCase();
                
                // Если в комнате больше нет участников, кроме создателя, скрываем её
                if (myCleanId && creatorCleanId === myCleanId && room.name === document.getElementById('user-info').innerText.replace(' 👑', '').trim()) {
                    continue;
                }
            }
        } catch(e) {
            // Резервный перехват, чтобы ошибки кодировки не вешали цикл
        }
        
        var div = document.createElement('div');
        div.className = 'room-item' + (room.id_room == currentRoomId ? ' active' : '');
        div.innerText = (room.type === 'private' ? '💬 ' : (room.type === 'admin_group' ? '👑 ' : '👥 ')) + room.name;
        
        if (room.id_room == currentRoomId) {
            currentRoomType = room.type;
            currentRoomCreator = room.created_by;
            document.getElementById('current-chat-title').innerText = room.name;
            document.getElementById('chat-management-actions').style.display = (currentUserRole === 'admin' || room.created_by == currentUserId) && room.type !== 'private' ? 'flex' : 'none';
            document.getElementById('btn-add-participant').style.display = room.type === 'private' ? 'none' : 'inline-block';
        }
        
        (function(r) { 
            div.onclick = function() { selectRoomById(r.id_room); }; 
        })(room);
        
        container.appendChild(div);
    }
}

function renderUsersRightPanel(users) {
    var container = document.getElementById('users-list-right');
    if (!container) return;
    container.innerHTML = "";
    for (var i = 0; i < users.length; i++) {
        var u = users[i];
        if (u.id_user == currentUserId) continue;
        
        var div = document.createElement('div');
        div.className = 'user-row';
        var firstLetter = u.username ? u.username.charAt(0).toUpperCase() : '?';
        var isOnline = (u.id_user === 'Admin' || u.role === 'admin'); 
        if (isOnline) div.className += ' online';

        div.innerHTML = '<div class="avatar-container"><div class="avatar">' + firstLetter + '</div><div class="status-online"></div></div>' +
                        '<div class="user-name-text">' + u.username + '</div>';
        
        (function(target) {
            div.onclick = function() {
                socket.emit('create_private_chat', { target_user_id: target.id_user, target_username: target.username });
            };
        })(u);
        container.appendChild(div);
    }
}

function renderParticipantsList(list) {
    var container = document.getElementById('participants-list');
    if (!container) return;
    container.innerHTML = "";

    if (currentRoomType === 'private' && list && list.length < 2) {
        document.getElementById('chat-window').style.opacity = "0.3";
        container.innerHTML = "<div style='font-size:11px;color:#ef4444;padding:6px;'>Собеседник покинул чат.</div>";
        document.getElementById('current-chat-title').innerText = "Диалог невозможен (собеседник удален)";
        socket.emit('get_rooms_again');
        return;
    } else {
        document.getElementById('chat-window').style.opacity = "1";
    }

    for (var i = 0; i < list.length; i++) {
        var p = list[i];
        var div = document.createElement('div');
        div.className = 'user-row';
        var firstLetter = p.username ? p.username.charAt(0).toUpperCase() : '?';
        div.innerHTML = '<div class="avatar-container"><div class="avatar" style="background:#10b981">' + firstLetter + '</div></div>' +
                        '<div class="user-name-text">' + p.username + '</div>';
        
        if (currentRoomType !== 'private' && p.id_user != currentUserId && (currentUserRole === 'admin' || currentRoomCreator == currentUserId)) {
            var btnKick = document.createElement('button');
            btnKick.className = 'btn-danger-xs';
            btnKick.innerText = 'Удалить';
            (function(tid) {
                btnKick.onclick = function(e) {
                    if (e.stopPropagation) e.stopPropagation(); else window.event.cancelBubble = true;
                    if (confirm("Исключить сотрудника из кабинета?")) socket.emit('remove_user_from_room', { room_id: currentRoomId, target_user_id: tid });
                };
            })(p.id_user);
            div.appendChild(btnKick);
        }
        container.appendChild(div);
    }
}

function displayMessage(msg, isBulkLoad) {
    try {
        var container = document.getElementById('messages-container');
        if (!container) return;
        var isMyMessage = (msg.id_user_from == currentUserId);
        
        var div = document.createElement('div');
        div.className = 'message' + (isMyMessage ? ' my' : '');
        div.setAttribute('data-msg-id', msg.id_message || msg.id);
        div.setAttribute('data-author-id', msg.id_user_from);

        var text = String(msg.encrypted_text || msg.text || "");
        var author = String(msg.username || "Сотрудник");

        var timeStr = "";
        if (msg.created_at) {
            var dateObj = new Date(msg.created_at);
            var hh = dateObj.getHours();
            var mm = dateObj.getMinutes();
            if (isNaN(hh) || isNaN(mm)) {
                var parts = msg.created_at.split('T');
                if (parts.length > 1) { timeStr = parts[1].substring(0, 5); }
            } else {
                timeStr = (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
            }
        }
        var timeHtml = timeStr ? '<span style="font-size:10px; color:#9ca3af; margin-left:8px; font-weight:normal; font-style:normal;">' + timeStr + '</span>' : '';

        if (msg.is_user_encrypted || text.indexOf("SECRET:") === 0) {
            var cipher = text.replace("SECRET:", "").replace(/<\/?[^>]+(>|$)/g, "").trim();
            var uid = 'c_' + Math.random().toString(36).substr(2, 6);
            text = '<div style="color:#ef4444; font-weight:bold;">🔒 Шифрованное сообщение</div><div id="'+uid+'" data-cipher="'+cipher+'">[Текст скрыт]</div>' +
                   '<button class="btn-small" style="background:#eab308; margin-top:4px;" onclick="decryptMsg(\''+uid+'\')">Расшифровать</button>';
        }
        
        div.innerHTML = '<div class="message-content"><span class="msg-author">' + author + timeHtml + '</span><div class="msg-text">' + text + '</div></div>';
        container.appendChild(div);
        if (!isBulkLoad) container.scrollTop = container.scrollHeight;
    } catch(e) {}
}

window.decryptMsg = function(elementId) {
    var el = document.getElementById(elementId);
    if (!el) return;
    openSecretModal("Введите секретный ключ", function(key) {
        try {
            var dec = CryptoJS.AES.decrypt(el.getAttribute("data-cipher"), key).toString(CryptoJS.enc.Utf8);
            if (dec) { el.innerHTML = dec; el.style.cssText = "color:#111827; font-weight:normal;"; } else { alert("Неверный ключ!"); }
        } catch(e) { alert("Ошибка расшифровки!"); }
    });
};

function sendMessage() {
    var text = (inputMsg.innerText || inputMsg.textContent || "").trim();
    if (!text || !currentRoomId) return;
    var sendAsSecret = isSecretMode;
    if (isSecretMode) { text = "SECRET:" + CryptoJS.AES.encrypt(text, userSecretKey).toString(); }
    socket.emit('send_message', { room_id: currentRoomId, text: text, is_secret: sendAsSecret });
    inputMsg.innerHTML = "";
}

function uploadFile(file) {
    var fd = new FormData(); fd.append('file', file);
    var xhr = new XMLHttpRequest(); xhr.open('POST', '/upload', true);
    xhr.onload = function() {
        if (xhr.status === 200) {
            var data = JSON.parse(xhr.responseText);
            if (data && data.url) {
                var isImg = /\.(jpg|jpeg|png|gif|webp)$/i.test(file.name);
                var absUrl = window.location.protocol + '//' + window.location.host + data.url;
                var content = isImg ? '<img src="' + absUrl + '" class="chat-image" onclick="window.open(\'' + absUrl + '\')" />' : 
                                      '<a href="javascript:void(0);" class="file-attachment" onclick="return downloadFile(\'' + data.url + '\', \'' + file.name.replace(/'/g, "\\'") + '\');">📄 Файл: ' + file.name + '</a>';
                socket.emit('send_message', { room_id: currentRoomId, text: content, is_secret: false });
            }
        }
    };
    xhr.send(fd);
}

function downloadFile(url, filename) {
    var fullUrl = window.location.protocol + '//' + window.location.host + url;
    try {
        window.open(fullUrl, '_blank', 'width=1,height=1,left=9999,top=9999,resizable=no,scrollbars=no,status=no');
    } catch(e) {
        var downloadAnchor = document.createElement('a');
        downloadAnchor.href = fullUrl;
        downloadAnchor.download = filename;
        downloadAnchor.target = '_blank';
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        document.body.removeChild(downloadAnchor);
    }
    return false;
}

function uploadBase64Image(rawInputString) {
    if (!currentRoomId || !socket || !rawInputString) return;
    
    var cleanBase64 = rawInputString.trim();
    if (cleanBase64.indexOf(",") !== -1) {
        cleanBase64 = cleanBase64.split(",")[1];
    }
    cleanBase64 = cleanBase64.replace(/<\/?[^>]+(>|$)/g, "").replace(/\s/g, "");

    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/1c/upload-base64', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onload = function() {
        if (xhr.status === 200) {
            var response = JSON.parse(xhr.responseText);
            if (response.success && response.url) {
                var absoluteUrl = window.location.protocol + '//' + window.location.host + response.url;
                var content = '<img src="' + absoluteUrl + '" class="chat-image" onclick="window.open(\'' + absoluteUrl + '\')" />';
                socket.emit('send_message', { room_id: currentRoomId, text: content, is_secret: false });
            }
        }
    };
    xhr.send(JSON.stringify({
        room_id: parseInt(currentRoomId),
        base64_data: cleanBase64,
        filename: "screenshot_" + Date.now() + ".png"
    }));
}

function handlePasteEvent(e) {
    if (!currentRoomId) return true;
    setTimeout(function() {
        try {
            var imgs = inputMsg.getElementsByTagName('img');
            if (imgs && imgs.length > 0) {
                var base64Src = imgs[0].src;
                if (base64Src && base64Src.indexOf("data:image") === 0) {
                    uploadBase64Image(base64Src); 
                }
                inputMsg.innerHTML = ""; 
            }
        } catch(err) {}
    }, 20);
    return true;
}

if (inputMsg) { inputMsg.onpaste = handlePasteEvent; }
window.onpaste = handlePasteEvent;

function triggerDeleteRoom() {
    if (!currentRoomId) return;
    if (confirm("Вы уверены, что хотите полностью удалить этот кабинет? Действие необратимо.")) {
        socket.emit('delete_room_request', { 
            room_id: parseInt(currentRoomId),
            user_id: currentUserId,
            role: currentUserRole
        });
    }
}

function triggerArchive() {
    if (!currentRoomId) return;
    if (confirm("Перенести переписку кабинета в архивный файл и очистить текущий чат на сервере?")) {
        socket.emit('archive_room_messages', { 
            room_id: parseInt(currentRoomId),
            user_id: currentUserId,
            role: currentUserRole
        });
    }
}

// ИСПРАВЛЕНО: Полная и точечная прорисовка кастомного меню удалений сообщений
document.getElementById('messages-container').oncontextmenu = function(e) {
    e = e || window.event;
    var target = e.target || e.srcElement;
    
    var msgDiv = target;
    while (msgDiv && msgDiv !== this) {
        if (msgDiv.getAttribute && msgDiv.getAttribute('data-msg-id')) {
            break;
        }
        msgDiv = msgDiv.parentNode;
    }
    
    if (!msgDiv || msgDiv === this) return true; 
    
    selectedMessageIdForCtx = msgDiv.getAttribute('data-msg-id');
    var authorId = msgDiv.getAttribute('data-author-id');
    
    if (selectedMessageIdForCtx) {
        var cleanAuthor = String(authorId).toUpperCase();
        var cleanCurrent = String(currentUserId).toUpperCase();
        
        if (currentUserRole === 'admin' || cleanAuthor === cleanCurrent) {
            if (e.preventDefault) e.preventDefault();
            e.returnValue = false; 
            e.cancelBubble = true;
            
            var menu = document.getElementById('custom-context-menu');
            menu.style.left = e.clientX + 'px';
            menu.style.top = e.clientY + 'px';
            menu.style.display = 'block';
            return false;
        }
    }
    return true;
};

document.onclick = function() {
    document.getElementById('custom-context-menu').style.display = 'none';
};

document.getElementById('ctx-delete-msg').onclick = function() {
    if (selectedMessageIdForCtx && currentRoomId) {
        if (confirm("Удалить это сообщение для всех участников?")) {
            socket.emit('delete_message_request', { 
                message_id: parseInt(selectedMessageIdForCtx), 
                room_id: parseInt(currentRoomId),
                user_id: currentUserId,
                role: currentUserRole
            });
        }
    }
};

function openUserModal(t, cb) {
    document.getElementById('modal-action-title').innerText = t;
    var d = document.getElementById('modal-user-dropdown'); d.innerHTML = "";
    for (var i=0; i<globalUsersCache.length; i++) { d.innerHTML += '<option value="'+globalUsersCache[i].id_user+'">'+globalUsersCache[i].username+'</option>'; }
    document.getElementById('user-select-modal').style.display = 'flex';
    document.getElementById('modal-submit-btn').onclick = function() { cb(d.value); closeUserModal(); };
}
function closeUserModal() { document.getElementById('user-select-modal').style.display = 'none'; }
function openSecretModal(t, cb) { document.getElementById('secret-input-modal').style.display = 'flex'; document.getElementById('secret-modal-submit-btn').onclick = function() { cb(document.getElementById('modal-secret-field').value); closeSecretModal(); }; }
function closeSecretModal() { document.getElementById('secret-input-modal').style.display = 'none'; }
function openTextModal(t, cb) { document.getElementById('text-input-modal').style.display = 'flex'; document.getElementById('text-modal-submit-btn').onclick = function() { cb(document.getElementById('modal-text-field').value); closeTextModal(); }; }
function closeTextModal() { document.getElementById('text-input-modal').style.display = 'none'; }

document.getElementById('btn-paste-screen').onclick = function() {
    if (!currentRoomId) { alert("Выберите кабинет перед отправкой скриншота!"); return; }
    inputMsg.focus();
    try {
        if (document.execCommand) { document.execCommand('paste'); }
    } catch(err) {}
};

document.getElementById('btn-add-participant').onclick = function() { openUserModal("Добавить сотрудника", function(uid) { socket.emit('add_user_to_room', { room_id: currentRoomId, user_id: uid }); }); };
document.getElementById('btn-create-group').onclick = function() { openTextModal("Создать кабинет", function(name) { socket.emit('create_group_chat', { group_name: name }); }); };
document.getElementById('btn-secret').onclick = function() {
    if (!isSecretMode) { openSecretModal("Секретный ключ", function(k) { userSecretKey = k; isSecretMode = true; document.getElementById('btn-secret').className = 'btn-secret active'; document.getElementById('btn-secret').innerText = '🔒 Шифрование ВКЛ'; }); }
    else { isSecretMode = false; this.className = 'btn-secret'; this.innerText = '🔒 Обычный режим'; }
};
document.getElementById('btn-send').onclick = sendMessage;
document.getElementById('btn-file').onclick = function() { document.getElementById('file-input').click(); };
document.getElementById('file-input').onchange = function(e) { if (e.target.files[0]) uploadFile(e.target.files[0]); };
if (inputMsg) { inputMsg.onkeydown = function(e) { if ((e || window.event).key === 'Enter' && !(e || window.event).shiftKey) { e.preventDefault(); sendMessage(); } }; }

function parseHashAndAuthorize() {
    try {
        var hash = window.location.hash;
        if (hash && hash.length > 1) {
            var cleanHash = decodeURIComponent(hash.substring(1));
            var p = cleanHash.split("---");
            if (p && p.length >= 3) {
                if (currentUserId && currentUserId !== p[0]) {
                    window.location.reload(true);
                    return;
                }
                apply1CAuth(p[0], p[1], p[2], p[3] || 'user');
            }
        }
    } catch(e) {}
}

window.onload = parseHashAndAuthorize;
window.onhashchange = parseHashAndAuthorize;
</script>
